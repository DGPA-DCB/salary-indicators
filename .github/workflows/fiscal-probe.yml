name: 財政統計年報下載
on:
  workflow_dispatch:
  schedule:
    - cron: "47 1 3 * *"   # 每月3日 臺北時間09:47
  push:
    branches: [main]
    paths: ["scripts/fiscal_probe.py", "scripts/fiscal_fetch.py", "scripts/opendata_discover.py"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get install -y poppler-utils >/dev/null
      - run: python scripts/fiscal_fetch.py && python scripts/fiscal_hist.py 2>&1 | tee opendata/fiscal/run.log
        continue-on-error: true
      - run: python scripts/opendata_discover.py 2>&1 | tee opendata/discover.log
        continue-on-error: true
      - run: |
          git config user.name "DGPA 給與福利處（自動下載）"
          git config user.email "drw@dgpa.gov.tw"
          git add opendata/fiscal opendata/discover.json opendata/discover.log
          git diff --cached --quiet || git commit -m "財政部來源探勘 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main && git push origin main
