name: 主計總處新聞稿附表下載
on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"   # 每日臺北時間10:15（薪資新聞稿約每月中旬、國民所得預測約2/5/8/11月底）
  push:
    branches: [main]
    paths: ["scripts/dgbas_probe.py", "scripts/dgbas_fetch.py"]
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install cryptography && sudo apt-get install -y poppler-utils >/dev/null
      - run: python scripts/dgbas_fetch.py
        continue-on-error: true
      - run: |
          git config user.name "DGPA 給與福利處（自動下載）"
          git config user.email "drw@dgpa.gov.tw"
          git add opendata/dgbas
          git diff --cached --quiet || git commit -m "主計總處探勘 $(TZ=Asia/Taipei date +%F)"
          git pull --rebase origin main && git push origin main
